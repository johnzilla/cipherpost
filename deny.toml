# cargo-deny policy. Enforces supply-chain gates per PITFALLS #13.
# License allowlist is conservative: MIT/Apache-2.0/BSD family only.

[advisories]
version = 2
# Phase 7: accept RUSTSEC-2023-0071 (Marvin Attack on rsa 0.9). The `rsa` crate
# is transitively pulled by `pgp 0.19.0` for RFC 4880 RSA key support. Cipherpost
# uses the pgp crate ONLY for packet parsing and metadata extraction — we do not
# decrypt, sign, encrypt, or perform any private-key RSA operation. The Marvin
# timing attack requires a network-observable decryption/signing oracle; no such
# surface exists in cipherpost's parse-only code path. Impact: low. Remove this
# ignore when upstream `rsa` ships a constant-time patched version.
#
# RUSTSEC-2026-0173 (proc-macro-error2 unmaintained): a BUILD-TIME proc-macro
# pulled transitively by `age 0.11.2` -> `i18n-embed-fl` (localized error
# messages). It is "unmaintained", NOT a vulnerability — it runs only at compile
# time and ships no code into the cipherpost binary. Pre-existing upstream drift,
# unrelated to any cipherpost code path. Remove when `age`/`i18n-embed` drop it.
#
# RUSTSEC-2026-0205 (scc unsound): `scc::Array::insert` can double-free only IF the
# element's compare fn panics mid-unwind since V is dropped before compare. scc comes
# via `serial_test` (DEV-dep only — never in the shipped binary) which uses scc with
# default non-panicking comparators; no code path in cipherpost supplies a custom
# compare fn. Fixed in scc 3.8.4, but serial_test 4 (the only consumer upgrade path)
# requires rustc 1.93.1 > MSRV 1.88. Re-added after the advisory range was extended
# retroactively to cover scc 2.x (previously "no crate matched"). Remove when MSRV
# reaches 1.93.1 and serial_test can bump to 4.
#
# RUSTSEC-2026-0253 (lru unsound): `LruCache::pop()` can use-after-free only IF a
# value's `Drop` panics mid-pop (the pop lacks panic safety). `lru` is a TRANSITIVE
# dep of the DHT layer (pkarr 5.0.3 -> mainline 6.1.1 -> lru 0.16.4), used as an
# internal routing/query cache; cipherpost never constructs or calls LruCache and
# stores no Drop-panicking value types in it. Patched in lru >= 0.18.2, but
# mainline 6.1.1 pins lru ^0.16.2 (<0.17) and cipherpost's pkarr 5.0.3/5.0.4 pin is
# load-bearing (ed25519-dalek =3.0.0-pre.5), so no in-range fix exists — this is
# upstream drift we cannot resolve locally. Remove when pkarr/mainline bump lru to
# >= 0.18.2.
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0173",
    "RUSTSEC-2026-0205",
    "RUSTSEC-2026-0253",
]
# yanked = "deny" is default in v2
# Note: pkarr 5.0.3 transitively pulls ed25519-dalek 3.0.0-pre.5 (pre-release).
# If RUSTSEC flags this pre-release, add an explicit ignore with a TODO and PITFALLS-pin rationale.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"  # age pulls curve25519-dalek v4, pkarr pulls v5 — expected
wildcards = "deny"
deny = [
    # Hard-ban tokio as a direct cipherpost dependency (SCAF-05).
    # Allowed only transitively via pkarr (which uses async-compat → tokio internally).
    # Direct parents that may depend on tokio are pkarr and async-compat.
    { name = "tokio", wrappers = ["pkarr", "async-compat"] },
    # Hard-ban direct ChaCha20-Poly1305 imports (Pitfall #9 / CRYPTO-05).
    # cipherpost must only use ChaCha via age's API.
    { name = "chacha20poly1305", wrappers = ["age", "age-core"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
